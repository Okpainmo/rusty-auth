name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --locked --all --all-features

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --locked --all --all-features -- -D warnings

  test:
    name: TestSuite + Coverage
    runs-on: ubuntu-latest

    env:
      APP__ENV: development

      APP__SERVER__HOST: 127.0.0.1
      APP__SERVER__PORT: 8000

      APP__DATABASE__ENGINE: postgres
      APP__DATABASE__HOST: localhost
      APP__DATABASE__PORT: 5433
      APP__DATABASE__USER: rusty_auth
      APP__DATABASE__PASSWORD: rusty_auth
      APP__DATABASE__NAME: rusty_auth_test

      APP__AUTH__JWT_SECRET: ci-test-secret
      APP__AUTH__JWT_ACCESS_EXPIRATION_TIME_IN_HOURS: 1
      APP__AUTH__JWT_REFRESH_EXPIRATION_TIME_IN_HOURS: 24
      APP__AUTH__JWT_ONE_TIME_PASSWORD_LIFETIME_IN_MINUTES: 5

      DATABASE_URL: postgres://rusty_auth:rusty_auth@localhost:5433/rusty_auth_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rusty_auth
          POSTGRES_PASSWORD: rusty_auth
          POSTGRES_DB: rusty_auth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version 0.8.6 --no-default-features --features postgres

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run Migrations
        run: sqlx migrate run

      - name: Run Tests with Coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
